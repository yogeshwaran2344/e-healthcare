databases:
  - name: neurocare-postgres
    databaseName: neurocare
    user: neurocare_user
    plan: free

services:
  - type: web
    name: neurocare-platform
    runtime: python
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: neurocare-postgres
          property: connectionString
