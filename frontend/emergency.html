<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Medical Passport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="emergency-mode-body">
    <div class="container py-4" style="max-width: 720px;">
        <div class="text-center mb-3">
            <span class="badge bg-danger fs-6 px-3 py-2"><i class="bi bi-exclamation-triangle-fill me-1"></i> EMERGENCY MODE</span>
            <h1 class="h3 fw-bold text-white mt-3 mb-1">Emergency Medical Passport</h1>
            <p class="text-white-50 small mb-0">Read-only life-saving profile generated from the latest authorized patient records.</p>
        </div>
        <div id="emergencyPassportMount" class="emergency-mode-card">
            <div class="text-center text-white-50 py-5">
                <div class="spinner-border text-danger"></div>
                <p class="mt-2 mb-0">Loading emergency passport...</p>
            </div>
        </div>
        <p class="text-center text-white-50 small mt-3 mb-0">Access is logged. Clinical details beyond this scoped view are not shown.</p>
    </div>
    <script>
        function field(label, value, danger) {
            if (value === undefined || value === null || value === '') return '';
            const cls = danger ? 'text-danger fw-bold' : 'text-dark';
            return `<div class="col-12 col-md-6 mb-2"><div class="small text-muted text-uppercase">${label}</div><div class="${cls}">${value}</div></div>`;
        }
        function vitalsHtml(v) {
            if (!v || typeof v !== 'object') return '';
            const parts = [];
            if (v.blood_pressure || v.bp) parts.push('BP ' + (v.blood_pressure || v.bp));
            if (v.heart_rate || v.hr) parts.push('HR ' + (v.heart_rate || v.hr));
            if (v.spo2) parts.push('SpO2 ' + v.spo2);
            if (v.glucose) parts.push('Glucose ' + v.glucose);
            if (v.temperature || v.temp) parts.push('Temp ' + (v.temperature || v.temp));
            return parts.join(' · ');
        }
        async function load() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const mount = document.getElementById('emergencyPassportMount');
            if (!token) {
                mount.innerHTML = '<div class="alert alert-warning mb-0">No emergency token provided. Scan a valid patient QR code.</div>';
                return;
            }
            try {
                const res = await fetch('/api/closed-loop/passport/view/' + encodeURIComponent(token));
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || 'Unable to load passport');
                }
                mount.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <div class="text-uppercase small text-danger fw-bold">Emergency profile</div>
                            <h2 class="h4 fw-bold mb-0">${data.full_name || 'Patient'}</h2>
                        </div>
                        <span class="badge bg-danger">${data.blood_group || 'Blood unknown'}</span>
                    </div>
                    <div class="row">
                        ${field('Allergies', data.drug_allergies, true)}
                        ${field('Critical conditions', data.pre_existing_conditions)}
                        ${field('Medications', data.current_medications)}
                        ${field('Emergency contact', data.emergency_contact_phone)}
                        ${field('Age / gender', [data.age, data.gender].filter(Boolean).join(' · '))}
                        ${field('Physician', data.treating_physician_notes)}
                        ${field('Latest vitals', vitalsHtml(data.recent_vitals))}
                    </div>
                    <div class="small text-muted mt-3"><i class="bi bi-lock-fill me-1"></i>Read-only · ${data.scope_label || data.access_scope || ''} · Access logged</div>
                `;
            } catch (err) {
                mount.innerHTML = `<div class="alert alert-danger mb-0">${err.message}</div>`;
            }
        }
        load();
    </script>
</body>
</html>
